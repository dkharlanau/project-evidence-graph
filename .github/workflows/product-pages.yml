name: Publish Product Page

on:
  push:
    branches: [main]
    paths: ["docs/product.html", "docs/index.html", "docs/agent-manifest.json", "assets/social-preview.png", ".github/workflows/product-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage product site and explorer
        run: |
          mkdir -p _site/explorer _site/demo
          cp docs/product.html _site/index.html
          cp docs/index.html _site/explorer/index.html
          cp docs/agent-manifest.json _site/agent-manifest.json
          mkdir -p _site/assets
          cp assets/social-preview.png _site/assets/social-preview.png
          python project_review.py examples/customer-change.json \
            --quality-policy examples/quality-policy.json \
            --lifecycle \
            --markdown _site/demo/project-review.md \
            --html _site/demo/project-review.html
          python evidence_lifecycle.py examples/evidence-lifecycle.json \
            --json-output _site/demo/evidence-lifecycle.json \
            --markdown _site/demo/evidence-lifecycle.md
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Portfolio assurance contract

on:
  pull_request:
    paths:
      - .github/workflows/portfolio-assurance-contract.yml
      - cutover_adapter.py
      - docs/CUTOVER-INTEGRATION.md
      - tests/test_cutover_adapter.py
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

jobs:
  mapping-rac-cutover-project-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Evidence Graph
        uses: actions/checkout@v4

      - name: Checkout current Mapping as Code
        uses: actions/checkout@v4
        with:
          repository: dkharlanau/mapping-as-code
          ref: main
          path: _deps/mapping-as-code

      - name: Checkout current Reconciliation as Code
        uses: actions/checkout@v4
        with:
          repository: dkharlanau/reconciliation-as-code
          ref: main
          path: _deps/reconciliation-as-code

      - name: Checkout current Cutover Graph
        uses: actions/checkout@v4
        with:
          repository: dkharlanau/cutover-graph
          ref: main
          path: _deps/cutover-graph

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current Mapping and Reconciliation CLIs
        run: |
          python -m pip install ./_deps/mapping-as-code
          python -m pip install ./_deps/reconciliation-as-code

      - name: Build a linked RAC contract from current Mapping as Code
        run: |
          mkdir -p /tmp/portfolio-assurance
          cp _deps/mapping-as-code/examples/customer-master.yaml /tmp/portfolio-assurance/mapping.yaml
          cat > /tmp/portfolio-assurance/legacy.csv <<'CSV'
          customer_id,name,country
          1001,Example GmbH,DE
          1002,Example Inc,US
          CSV
          cat > /tmp/portfolio-assurance/s4.csv <<'CSV'
          BusinessPartner,OrganizationBPName1,Country
          1001,Example GmbH,DE
          1002,Example Inc,US
          CSV
          SHA=$(sha256sum /tmp/portfolio-assurance/mapping.yaml | cut -d' ' -f1)
          map-code project /tmp/portfolio-assurance/mapping.yaml \
            --target reconciliation-as-code \
            --source-file legacy.csv \
            --target-file s4.csv \
            --source-key customer_id \
            --target-key BusinessPartner \
            --mapping-artifact-file mapping.yaml \
            --mapping-artifact-sha256 "$SHA" \
            --format yaml \
            -o /tmp/portfolio-assurance/reconciliation.yaml

      - name: Run generated contract through current Reconciliation as Code
        run: |
          rac validate /tmp/portfolio-assurance/reconciliation.yaml
          rac run /tmp/portfolio-assurance/reconciliation.yaml \
            --evidence /tmp/rac-evidence.json \
            --report /tmp/rac-evidence.md

      - name: Assert current Mapping identity survived into RAC evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import yaml
          from pathlib import Path

          mapping_path = Path('/tmp/portfolio-assurance/mapping.yaml')
          mapping = yaml.safe_load(mapping_path.read_text(encoding='utf-8'))
          spec = yaml.safe_load(Path('/tmp/portfolio-assurance/reconciliation.yaml').read_text(encoding='utf-8'))
          evidence = json.loads(Path('/tmp/rac-evidence.json').read_text(encoding='utf-8'))

          assert spec['generated_from']['tool'] == 'mapping-as-code'
          assert spec['generated_from']['projection_mode'] == 'linked_source'
          assert spec['generated_from']['mapping_id'] == mapping['mapping']['id']
          artifact = spec['mapping_artifacts']['mapping-source']
          assert artifact['file'] == 'mapping.yaml'
          assert artifact['sha256'] == hashlib.sha256(mapping_path.read_bytes()).hexdigest()

          assert evidence['status'] == 'passed'
          provenance = evidence['inputs']['mapping:mapping-source']
          assert provenance['mapping_id'] == mapping['mapping']['id']
          assert provenance['fields'] == ['customer-country']
          assert provenance['sha256'] == artifact['sha256']
          assert evidence['configuration_sha256']
          PY

      - name: Bind the generated RAC run into the current Cutover checkpoint
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, '_deps/cutover-graph')
          from external_evidence import reconciliation_entry

          entry = reconciliation_entry('/tmp/rac-evidence.json')
          plan = json.loads(Path('_deps/cutover-graph/examples/checkpoint-cutover.json').read_text(encoding='utf-8'))
          plan['tasks'][1]['checkpoint']['evidence'][0]['ref'] = entry['ref']
          Path('/tmp/live-cutover.json').write_text(json.dumps(plan, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/rac-ref.txt').write_text(entry['ref'], encoding='utf-8')
          PY

      - name: Build Cutover evidence registry and both artifact export modes
        run: |
          python _deps/cutover-graph/external_evidence.py build /tmp/registry.json /tmp/rac-evidence.json > /tmp/registry-output.json
          python _deps/cutover-graph/cutover_artifacts.py /tmp/live-cutover.json --output /tmp/unverified-cutover-artifacts.json
          python _deps/cutover-graph/cutover_artifacts.py /tmp/live-cutover.json --registry /tmp/registry.json --output /tmp/verified-cutover-artifacts.json

      - name: Import both Cutover indexes into Project Evidence Graph
        run: |
          python cutover_adapter.py /tmp/unverified-cutover-artifacts.json --output /tmp/unverified-project-fragment.json
          python cutover_adapter.py /tmp/verified-cutover-artifacts.json --output /tmp/verified-project-fragment.json

      - name: Assert fail-closed and verified assurance behavior end to end
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evidence_graph import validate

          rac_ref = Path('/tmp/rac-ref.txt').read_text(encoding='utf-8').strip()
          evidence = json.loads(Path('/tmp/rac-evidence.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('/tmp/registry.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('/tmp/unverified-project-fragment.json').read_text(encoding='utf-8'))
          verified = json.loads(Path('/tmp/verified-project-fragment.json').read_text(encoding='utf-8'))

          assert validate(raw)['valid'] is True
          assert validate(verified)['valid'] is True

          raw_checkpoint = next(node for node in raw['nodes'] if node['id'].endswith('/checkpoint/reconcile-customers'))
          assert raw_checkpoint['type'] == 'defect'
          assert raw_checkpoint['status'] == 'failed'
          assert raw_checkpoint['metadata']['assurance_passed'] is False
          assert raw_checkpoint['metadata']['assurance_mode'] == 'unverified_external'
          assert raw['cutover_import_diagnostics']['assurance_complete'] is False
          assert raw['external_bridges'] == [{
              'from': raw_checkpoint['id'],
              'to': rac_ref,
              'type': 'substantiated_by',
          }]

          checkpoint = next(node for node in verified['nodes'] if node['id'].endswith('/checkpoint/reconcile-customers'))
          assert checkpoint['type'] == 'evidence'
          assert checkpoint['status'] == 'passed'
          assert checkpoint['metadata']['assurance_passed'] is True
          assert checkpoint['metadata']['assurance_mode'] == 'external_registry'
          assert verified['cutover_import_diagnostics']['assurance_complete'] is True
          assert verified['external_bridges'] == [{
              'from': checkpoint['id'],
              'to': rac_ref,
              'type': 'substantiated_by',
          }]

          verification = checkpoint['metadata']['verifications'][0]
          entry = registry['entries'][0]
          assert verification['ref'] == rac_ref
          assert verification['document_sha256'] == entry['document_sha256']
          assert verification['configuration_sha256'] == evidence['configuration_sha256']
          assert entry['configuration_sha256'] == evidence['configuration_sha256']
          PY

      - name: Build reproducible assurance receipt
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
        run: |
          mkdir -p build/portfolio-assurance
          cp /tmp/portfolio-assurance/mapping.yaml build/portfolio-assurance/mapping.yaml
          cp /tmp/portfolio-assurance/reconciliation.yaml build/portfolio-assurance/reconciliation.yaml
          cp /tmp/rac-evidence.json build/portfolio-assurance/rac-evidence.json
          cp /tmp/rac-evidence.md build/portfolio-assurance/rac-evidence.md
          cp /tmp/registry.json build/portfolio-assurance/cutover-evidence-registry.json
          cp /tmp/unverified-cutover-artifacts.json build/portfolio-assurance/unverified-cutover-artifacts.json
          cp /tmp/verified-cutover-artifacts.json build/portfolio-assurance/verified-cutover-artifacts.json
          cp /tmp/unverified-project-fragment.json build/portfolio-assurance/unverified-project-fragment.json
          cp /tmp/verified-project-fragment.json build/portfolio-assurance/verified-project-fragment.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          out = Path('build/portfolio-assurance')

          def git_sha(path: str) -> str:
              return subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          artifacts = {}
          for path in sorted(out.iterdir()):
              if path.is_file() and path.name != 'receipt.json':
                  artifacts[path.name] = {
                      'sha256': sha256(path),
                      'bytes': path.stat().st_size,
                  }

          verified = json.loads((out / 'verified-project-fragment.json').read_text(encoding='utf-8'))
          unverified = json.loads((out / 'unverified-project-fragment.json').read_text(encoding='utf-8'))
          verified_checkpoint = next(node for node in verified['nodes'] if node['id'].endswith('/checkpoint/reconcile-customers'))
          unverified_checkpoint = next(node for node in unverified['nodes'] if node['id'].endswith('/checkpoint/reconcile-customers'))

          receipt = {
              'schema_version': '0.1',
              'purpose': 'moving-main-cross-repository-drift-assurance',
              'repositories': {
                  'project-evidence-graph': {'ref': 'workflow-checkout', 'commit': git_sha('.')},
                  'mapping-as-code': {'ref': 'main', 'commit': git_sha('_deps/mapping-as-code')},
                  'reconciliation-as-code': {'ref': 'main', 'commit': git_sha('_deps/reconciliation-as-code')},
                  'cutover-graph': {'ref': 'main', 'commit': git_sha('_deps/cutover-graph')},
              },
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID_VALUE'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT_VALUE'],
                  'event': os.environ['GITHUB_EVENT_NAME_VALUE'],
              },
              'assertions': {
                  'verified_path_passed': verified_checkpoint['type'] == 'evidence' and verified_checkpoint['status'] == 'passed' and verified['cutover_import_diagnostics']['assurance_complete'] is True,
                  'unverified_path_failed_closed': unverified_checkpoint['type'] == 'defect' and unverified_checkpoint['metadata']['assurance_passed'] is False and unverified['cutover_import_diagnostics']['assurance_complete'] is False,
              },
              'artifacts': artifacts,
              'scope': 'Synthetic interoperability evidence for exact checked-out commits; not an external validation or a pinned release-compatibility claim.',
          }
          assert all(receipt['assertions'].values())
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload assurance receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/portfolio-assurance
          if-no-files-found: error
          retention-days: 90

name: CI

on:
  push:
    paths-ignore:
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python evidence_graph.py examples/customer-change.json analyze
      - run: python evidence_graph.py examples/customer-change.json path REQ-001 EVID-001
      - run: python evidence_graph.py examples/customer-change.json impact TEST-001
      - run: python quality_gate.py examples/customer-change.json examples/quality-policy.json
      - run: python evidence_freshness.py examples/evidence-freshness.json examples/freshness-policy.json
      - run: python risk_assurance.py examples/risk-assurance.json examples/risk-policy.json
      - run: python csv_adapter.py examples/csv/manifest.json --output /tmp/project-evidence.json
      - run: python evidence_graph.py /tmp/project-evidence.json analyze
      - run: python github_adapter.py examples/github/export.json --config examples/github/config.json --output /tmp/github-evidence.json
      - run: python evidence_graph.py /tmp/github-evidence.json analyze
      - run: python workitem_adapter.py examples/workitems/jira-export.json --profile jira --output /tmp/jira-evidence.json
      - run: python evidence_graph.py /tmp/jira-evidence.json analyze
      - run: python workitem_adapter.py examples/workitems/alm-export.json --profile examples/workitems/alm-profile.json --output /tmp/alm-evidence.json
      - run: python evidence_graph.py /tmp/alm-evidence.json analyze
      - run: python cross_repo.py examples/cross-repo-pack.json --output /tmp/cross-repo-evidence.json
      - run: python evidence_graph.py /tmp/cross-repo-evidence.json analyze
      - run: python evidence_graph.py /tmp/cross-repo-evidence.json path REQ-COUNTRY EVID-COUNTRY

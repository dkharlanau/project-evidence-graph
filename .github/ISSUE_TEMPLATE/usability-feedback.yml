name: External usability feedback
description: Report a privacy-safe 15-minute first-use session for Project Evidence Graph.
title: "Usability: "
labels:
  - usability
body:
  - type: markdown
    attributes:
      value: Use only synthetic or intentionally public details. Do not include client data, ticket text, internal URLs, credentials, or proprietary evidence.
  - type: input
    id: release
    attributes:
      label: Release or commit tested
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: dropdown
    id: completed
    attributes:
      label: Completed within 15 minutes
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: First blocker or confusing step
    validations:
      required: true
  - type: textarea
    id: integrity
    attributes:
      label: How did you understand pack integrity versus project acceptance?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Most useful improvement
    validations:
      required: true
